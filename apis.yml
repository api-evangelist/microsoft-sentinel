        type: OpenAPI
    description: >-
      The Microsoft Sentinel REST API provides programmatic access to security incident management, threat intelligence,
      watchlists, analytics rules, and automation playbooks. Developers can manage incidents, configure data connectors,
      create custom detection rules, and automate security response workflows through Azure Resource Manager endpoints.
